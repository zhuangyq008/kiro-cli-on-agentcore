[project]
name = "kac"
version = "0.1.0"
description = "Command-line client for kiro-cli on AgentCore"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Only needed for `kac configure --from-stack`.
aws = ["boto3>=1.40"]

[project.scripts]
kac = "kac.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "boto3>=1.40",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
