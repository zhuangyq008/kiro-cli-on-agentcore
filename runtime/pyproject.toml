[project]
name = "kiro-runtime"
version = "0.2.1"
description = "AgentCore Runtime wrapper that runs kiro-cli in a closed-loop orchestrator"
requires-python = ">=3.12"
dependencies = [
    "aws-opentelemetry-distro>=0.22.0",
    "bedrock-agentcore>=1.0",
    "boto3>=1.40",
    "pydantic>=2.8",
    "pyyaml>=6",
]

# Selected by OTEL_PYTHON_ID_GENERATOR in the Dockerfile (see kiro_runtime/snapshot.py).
[project.entry-points.opentelemetry_id_generator]
snapshot_safe_xray = "kiro_runtime.snapshot:SnapshotSafeXRayIdGenerator"

[dependency-groups]
dev = [
    "pytest>=8",
    "moto[dynamodb,s3,events,secretsmanager]>=5",
    "ruff>=0.6",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiro_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
