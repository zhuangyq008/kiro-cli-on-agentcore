<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 770" role="img" aria-label="kiro-cli on AgentCore 架构">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5cc8ff"/>
    </marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff9900"/>
    </marker>
  </defs>

  <!-- account boundary -->
  <rect class="acct" data-hl="5" x="420" y="20" width="990" height="730" rx="22"/>
  <text class="acctlbl" data-hl="5" x="1386" y="730" text-anchor="end">你的 AWS 账号</text>

  <!-- runtime -->
  <g data-r="1">
    <rect class="box" x="470" y="250" width="560" height="300" rx="16"/>
    <text class="t1" x="496" y="298">AgentCore Runtime</text>
    <g>
      <rect class="vm" data-hl="3" x="496" y="330" width="160" height="190" rx="12"/>
      <text class="t2" x="576" y="400" text-anchor="middle">microVM</text>
      <text class="t1" x="576" y="452" text-anchor="middle">kiro-cli</text>
      <rect class="vm" data-hl="3" x="670" y="330" width="160" height="190" rx="12"/>
      <text class="t2" x="750" y="400" text-anchor="middle">microVM</text>
      <text class="t1" x="750" y="452" text-anchor="middle">kiro-cli</text>
      <rect class="vm" data-hl="3" x="844" y="330" width="160" height="190" rx="12"/>
      <text class="t2" x="924" y="400" text-anchor="middle">microVM</text>
      <text class="t1" x="924" y="452" text-anchor="middle">kiro-cli</text>
    </g>
  </g>

  <!-- caller, login -->
  <g data-r="2">
    <rect class="box" x="20" y="270" width="280" height="260" rx="16"/>
    <text class="t1" x="160" y="326" text-anchor="middle">调用方</text>
    <text class="t2" x="160" y="376" text-anchor="middle">开发者笔记本</text>
    <text class="t2" x="160" y="414" text-anchor="middle">CI 流水线</text>
    <rect x="80" y="446" width="160" height="52" rx="26" fill="#ff9900"/>
    <text x="160" y="481" text-anchor="middle" style="fill:#111;font-size:26px;font-weight:700">kac CLI</text>

    <rect class="box" x="470" y="95" width="250" height="110" rx="16"/>
    <text class="t1" x="595" y="142" text-anchor="middle">Cognito</text>
    <text class="t2" x="595" y="180" text-anchor="middle">登录，签发 token</text>

    <path class="arrow" d="M160 270 V150 H470"/>
    <text class="lbl" x="180" y="138">① 登录</text>
    <path class="arrow" d="M300 400 H470"/>
    <text class="lbl" x="322" y="386">② 提交</text>
  </g>

  <!-- data -->
  <g data-r="4">
    <rect class="box" x="780" y="95" width="250" height="110" rx="16"/>
    <text class="t1" x="905" y="142" text-anchor="middle">Secrets Manager</text>
    <text class="t2" x="905" y="180" text-anchor="middle">API key、Git token</text>
    <path class="arrow" d="M905 250 V205"/>

    <rect class="box" x="1110" y="95" width="270" height="120" rx="16"/>
    <text class="t1" x="1245" y="146" text-anchor="middle">S3</text>
    <text class="t2" x="1245" y="186" text-anchor="middle">结果和产物</text>
    <rect class="box" x="1110" y="250" width="270" height="120" rx="16"/>
    <text class="t1" x="1245" y="301" text-anchor="middle">DynamoDB</text>
    <text class="t2" x="1245" y="341" text-anchor="middle">任务状态</text>
    <rect class="box" x="1110" y="405" width="270" height="120" rx="16"/>
    <text class="t1" x="1245" y="456" text-anchor="middle">EventBridge</text>
    <text class="t2" x="1245" y="496" text-anchor="middle">任务结束通知</text>
    <path class="arrow" d="M1030 290 H1070 V155 H1110"/>
    <path class="arrow" d="M1030 325 H1110"/>
    <path class="arrow" d="M1030 465 H1110"/>

    <rect class="box" x="470" y="610" width="560" height="100" rx="16"/>
    <text class="t1" x="496" y="670">查询 API</text>
    <text class="t2" x="1004" y="670" text-anchor="end">API Gateway + Lambda</text>
    <path class="arrow" d="M160 530 V660 H470"/>
    <text class="lbl" x="180" y="648">③ 查询、下载结果</text>
  </g>

  <!-- outside the account -->
  <g data-r="5">
    <rect class="ext-box" x="1480" y="320" width="220" height="200" rx="16"/>
    <text class="t1" x="1590" y="400" text-anchor="middle">Kiro 服务</text>
    <text class="t2" x="1590" y="444" text-anchor="middle">模型推理</text>
    <text class="t3" x="1590" y="482" text-anchor="middle">在账号之外</text>
    <path class="arrow ext" d="M960 550 V580 H1445 V420 H1480"/>
    <text class="lbl" x="1110" y="570" style="fill:#ff9900">prompt 和 agent 读到的代码</text>
  </g>
</svg>
