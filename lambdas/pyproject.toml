[project]
name = "kiro-lambdas"
version = "0.2.1"
description = "Query API and Sweeper Lambda functions"
requires-python = ">=3.12"
# boto3 is provided by the Lambda runtime; no other runtime dependencies.
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "boto3>=1.40",
    "pytest>=8",
    "moto[dynamodb,s3,events]>=5",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
